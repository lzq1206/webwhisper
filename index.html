<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Orbit Feed：你的信息流，由你的参数决定。" />
  <title>Orbit Feed | 算法控制台演示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">[Orbit_Feed]</div>
    <p class="slogan">你的信息流，由你的参数决定</p>
  </header>

  <main class="layout">
    <button id="panelToggle" class="panel-toggle" aria-expanded="false" aria-controls="controlPanel">
      打开算法控制台
    </button>

    <aside id="controlPanel" class="control-panel" aria-label="Algorithm Control Panel">
      <h1>Algorithm Control Panel</h1>

      <form class="controls" autocomplete="off">
        <label for="exploration">跨界探索度 <span id="explorationValue">55</span></label>
        <input id="exploration" type="range" min="0" max="100" value="55" />

        <label for="rigor">学术严谨度 <span id="rigorValue">70</span></label>
        <input id="rigor" type="range" min="0" max="100" value="70" />

        <label for="timeline">时间线权重 <span id="timelineValue">45</span></label>
        <input id="timeline" type="range" min="0" max="100" value="45" />

        <div class="meter-card" aria-label="参数雷达图替代展示">
          <div class="meter-row">
            <span>探索度</span>
            <div class="meter-track"><i id="explorationMeter"></i></div>
          </div>
          <div class="meter-row">
            <span>严谨度</span>
            <div class="meter-track"><i id="rigorMeter"></i></div>
          </div>
          <div class="meter-row">
            <span>时间线</span>
            <div class="meter-track"><i id="timelineMeter"></i></div>
          </div>
        </div>

        <button id="resetBtn" type="button" class="reset-btn">重置为默认</button>
      </form>
    </aside>

    <section class="feed-section" aria-live="polite">
      <h2>Dynamic Feed Simulation</h2>
      <p class="feed-tip">拖动左侧参数，实时查看 Feed 排序变化。</p>
      <ul id="feedList" class="feed-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
