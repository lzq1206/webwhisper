<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WebWhisper：可匿名发帖 + 算法调控后台 + 1000条虚拟内容演示。" />
  <title>WebWhisper Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>WebWhisper Demo</h1>
      <p>前台发布 + 后台算法控制 + 1000 条虚拟帖子</p>
    </div>
    <button id="seedBtn" class="secondary-btn" type="button">重置并生成 1000 条演示帖子</button>
  </header>

  <main class="layout">
    <aside class="admin-panel" aria-label="后台控制面板">
      <h2>后台控制</h2>

      <label for="exploration">跨界探索度 <span id="explorationValue">55</span></label>
      <input id="exploration" type="range" min="0" max="100" value="55" />

      <label for="rigor">学术严谨度 <span id="rigorValue">70</span></label>
      <input id="rigor" type="range" min="0" max="100" value="70" />

      <label for="timeline">时间线权重 <span id="timelineValue">45</span></label>
      <input id="timeline" type="range" min="0" max="100" value="45" />

      <label for="minScore">最低展示分 <span id="minScoreValue">35</span></label>
      <input id="minScore" type="range" min="0" max="100" value="35" />

      <label class="checkbox-row">
        <input id="hideImages" type="checkbox" />
        隐藏图片帖子
      </label>

      <label class="checkbox-row">
        <input id="autoRegulation" type="checkbox" checked />
        开启自动调控（提升多样性）
      </label>

      <label for="targetDiversity">目标多样性 <span id="targetDiversityValue">60</span></label>
      <input id="targetDiversity" type="range" min="0" max="100" value="60" />

      <button id="resetBtn" class="secondary-btn" type="button">恢复默认参数</button>

      <section class="stats" aria-live="polite">
        <h3>算法效果</h3>
        <p>总帖子：<strong id="statTotal">0</strong></p>
        <p>当前展示：<strong id="statShown">0</strong></p>
        <p>多样性指数：<strong id="statDiversity">0</strong></p>
        <p>图片占比：<strong id="statImageRatio">0%</strong></p>
      </section>
    </aside>

    <section class="content-panel" aria-live="polite">
      <div class="composer-card">
        <h2>前台发帖（无需注册）</h2>
        <form id="postForm" autocomplete="off">
          <label for="author">昵称（可空，默认匿名）</label>
          <input id="author" type="text" maxlength="32" placeholder="例如：匿名观察员" />

          <label for="textContent">帖子内容（文字）</label>
          <textarea id="textContent" maxlength="280" rows="4" placeholder="输入你想发布的内容"></textarea>

          <label for="imageUrl">图片地址（可选）</label>
          <input id="imageUrl" type="url" placeholder="https://example.com/demo.jpg" />

          <label for="imageFile">或上传本地图片（可选）</label>
          <input id="imageFile" type="file" accept="image/*" />

          <button class="primary-btn" type="submit">立即发布</button>
          <p id="formMessage" class="form-message" role="status"></p>
        </form>
      </div>

      <div class="feed-header">
        <h2>动态信息流</h2>
        <p>按算法评分实时排序，展示自动调控效果。</p>
      </div>
      <ul id="feedList" class="feed-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
